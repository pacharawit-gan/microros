# Nav2 parameters for the Yahboom MicroROS-Pi5 4WD car.
#
#   ros2 launch microros_pi5_nav nav2.launch.py map:=my_map
#
# ============================================================================
# THREE THINGS HERE ARE ROBOT-SPECIFIC AND MATTER MORE THAN THE REST
# ============================================================================
#
# 1. cmd_vel goes to cmd_vel_raw, NOT /cmd_vel.
#    `cmd_vel_safety` is the only node allowed to publish /cmd_vel on this robot.
#    The remap lives in nav2.launch.py; if you ever bypass it, Nav2 and the safety
#    node become two publishers on a motion topic and the board obeys whichever
#    arrived last. Nav2's own velocity_smoother is deliberately NOT run - it would
#    be a second slew limiter in series with cmd_vel_safety, and tuning two
#    smoothers against each other is a bad time.
#
# 2. Velocity limits stay UNDER cmd_vel_safety's clamps (0.5 m/s, 2.0 rad/s).
#    Nav2 asking for more than the safety node allows just gets silently clamped,
#    which makes the controller's model of the robot wrong and the tracking poor.
#    Keep this file's max_vel_* strictly below base_params.yaml's max_*.
#
# 3. Ranges match the MEASURED MS200: 0.12-8.0 m, 360 points, ~10-13 Hz.
#
#    CAREFUL - the firmware publishes range values OUTSIDE the range_min/range_max
#    it declares in the same message. Observed 2026-08-31: declared 0.12-8.0 m,
#    actual data 0.031-11.305 m, with ~3% of beams inf/nan.
#
#    The sub-0.12 m returns are spurious - reflections off the robot's own chassis
#    and gimbal. Anything that trusts them puts phantom obstacles directly on top
#    of the robot, the footprint reads as permanently in collision, and Nav2
#    refuses to move while reporting nothing obviously wrong. Hence
#    obstacle_min_range: 0.12 rather than the stock 0.0 in BOTH costmaps below,
#    and min_laser_range: 0.12 in slam_toolbox.yaml.
#
#    raytrace_min_range stays 0.0 on purpose: clearing should start at the sensor
#    origin. It is only the MARKING of near returns that must be suppressed.
#
# ============================================================================
# FOOTPRINT - derived, not guessed, but from UNMEASURED xacro values
# ============================================================================
#   chassis 0.200 (x) x 0.170 (y); wheel track 0.180 + wheel width 0.027
#   half-length            = 0.100
#   half-width over wheels = 0.180/2 + 0.027/2 = 0.1035
#   circumscribed radius   = hypot(0.100, 0.1035) = 0.144  ->  0.16 with margin
#
# Every one of those inputs is a documented estimate from the xacro's
# "!! MEASURE ME !!" block. Caliper the chassis and redo this arithmetic before
# you trust the robot near a doorway.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # 6-axis IMU, no magnetometer, and wheel odometry with unmeasured scale error.
    # alpha1/alpha2 (rotation noise) are therefore left generous.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2      # rotation noise from rotation
    alpha2: 0.2      # rotation noise from translation
    alpha3: 0.2      # translation noise from translation
    alpha4: 0.2      # translation noise from rotation
    alpha5: 0.2      # strafe noise (unused on a diff drive)

    # Match the real sensor. laser_max_range above the true 8.0 m invents returns.
    laser_min_range: 0.12
    laser_max_range: 8.0
    max_beams: 60
    laser_model_type: "likelihood_field"
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # Small robot, so it must resample after short moves or it delocalises.
    update_min_a: 0.2      # rad
    update_min_d: 0.15     # m
    resample_interval: 1
    transform_tolerance: 0.5
    save_pose_rate: 0.5
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml are omitted on
    # purpose so Nav2 uses its shipped trees - hardcoding the path breaks on upgrade.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Below this the controller treats the robot as stopped. The board reports
    # small non-zero velocities at rest, so these are not as tight as stock.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # 12 cm on a robot with a 16 cm radius. Tighter than this and uncalibrated
      # odometry means it hunts around the goal and never declares success.
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # ---- velocity and acceleration limits ----
      # Ceilings are cmd_vel_safety's clamps (0.5 m/s, 2.0 rad/s); these sit well
      # under them. Accelerations mirror max_linear_accel / max_angular_accel in
      # base_params.yaml so DWB predicts trajectories the safety node will allow.
      min_vel_x: 0.0
      max_vel_x: 0.22
      min_vel_y: 0.0            # differential drive: no strafing, ever
      max_vel_y: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      max_vel_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0

      vx_samples: 20
      vy_samples: 1             # 1, not 0 - zero samples means no trajectories
      vtheta_samples: 40        # generous: this chassis turns better than it drives

      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 3x3 m window. The lidar sees 8 m but DWB only plans 1.5 s ahead at
      # 0.22 m/s, so a larger window is wasted CPU on a Pi-class machine.
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.16
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          # The board publishes BEST_EFFORT. Nav2's costmap defaults to sensor-data
          # QoS which is also BEST_EFFORT, so these match. If scans ever stop
          # arriving, check this first - a RELIABLE subscriber never matches a
          # BEST_EFFORT publisher and fails silently.
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0    # under the 8.0 max: far returns are noisy
          obstacle_min_range: 0.12   # NOT 0.0 - see the note above observation_sources

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.25 m around a 0.16 m robot. Raise it and the robot refuses doorways;
        # lower it and it clips corners.
        inflation_radius: 0.25

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.16
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12   # NOT 0.0 - see the note above observation_sources

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""      # supplied by nav2.launch.py's map: argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Recovery rotation speed. Kept below cmd_vel_safety's 2.0 rad/s clamp.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
